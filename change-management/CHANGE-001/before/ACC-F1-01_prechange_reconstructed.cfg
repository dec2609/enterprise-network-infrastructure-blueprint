! ==============================================================================
! DEVICE: ACC-F1-01 (Access Switch Floor 1 - Catalyst 2960)
! ROLE: Floor 1 Access Ports (HR, FIN, CCTV, Management)
! STATUS: RECONCILED & FROZEN (PHASE 12)
! ==============================================================================
version 15.0
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ACC-F1-01
!
spanning-tree mode rapid-pvst
spanning-tree logging
spanning-tree extend system-id
!
vlan 30
 name HR_Zone
vlan 40
 name FIN_Zone
vlan 70
 name MGMT_TRANSIT_Zone
vlan 80
 name QUARANTINE_Zone
vlan 90
 name GUEST_Zone
vlan 999
 name NATIVE_DEAD_Zone
!
ip dhcp snooping
ip dhcp snooping vlan 30,40,70,80,90
no ip dhcp snooping information option
!
interface Port-channel1
 description LACP Trunk Uplink to CORE-L3-01
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 ip dhcp snooping trust
!
interface FastEthernet0/1
 description HR Workstation 1
 switchport access vlan 30
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description HR Workstation 2
 switchport access vlan 30
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/10
 description Finance Workstation 1
 switchport access vlan 40
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/19
 description CCTV Camera Floor 1
 switchport access vlan 70
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/20
 description CCTV Camera Floor 1 Backup
 switchport access vlan 70
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/21
 description Unused Security Port
 switchport access vlan 80
 switchport mode access
 shutdown
!
interface FastEthernet0/22
 description Guest Access Port
 switchport access vlan 90
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/23
 description LACP Member 1 to Core 1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 1 mode active
!
interface FastEthernet0/24
 description LACP Member 2 to Core 1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 1 mode active
!
interface Vlan70
 description Management SVI
 ip address 10.10.70.101 255.255.255.0
!
ip default-gateway 10.10.70.10
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
