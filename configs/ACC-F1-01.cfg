! ACC-F1-01 Production Configuration
! Vendor: Cisco IOS (Catalyst 2960-24PS / Floor 1 Access Switch)
hostname ACC-F1-01

spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default

ip dhcp snooping
ip dhcp snooping vlan 10-90

vlan 30
 name HR
vlan 40
 name FIN
vlan 80
 name VOICE
vlan 90
 name GUEST
vlan 999
 name NATIVE

interface Port-channel1
 description LACP Uplink to CORE-L3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust

interface GigabitEthernet0/1
 description Uplink Link 1 to Core
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 channel-group 1 mode active

interface GigabitEthernet0/2
 description Uplink Link 2 to Core
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 channel-group 1 mode active

! HR User Ports
interface range FastEthernet0/1 - 8
 description HR Workstation Access Ports
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable

! Finance User Ports
interface range FastEthernet0/9 - 16
 description Finance Workstation Access Ports
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable

! AP & Voice Ports
interface range FastEthernet0/17 - 20
 description APs and IP Phones
 switchport mode access
 switchport access vlan 80
 switchport voice vlan 80
 spanning-tree portfast

! Unused Ports Parking
interface range FastEthernet0/21 - 24
 switchport mode access
 switchport access vlan 999
 shutdown

interface Vlan70
 description Management Interface
 ip address 10.10.70.21 255.255.255.0
 no shutdown

ip default-gateway 10.10.70.1
end
