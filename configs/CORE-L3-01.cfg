! CORE-L3-01 Production Configuration
! Vendor: Cisco IOS (Catalyst 3650 / Collapsed Core Layer 3 Switch)
! Module 1: System Initialization
hostname CORE-L3-01
boot-start-marker
boot-end-marker
no ip domain-lookup
ip cef

! Module 2: Spanning-Tree & L2 Trunking
spanning-tree mode rapid-pvst
spanning-tree logging
spanning-tree pathcost method long
spanning-tree vlan 1-999 priority 4096

vlan 10
 name DEV
vlan 20
 name QA
vlan 30
 name HR
vlan 40
 name FIN
vlan 50
 name EXEC
vlan 60
 name SERVER
vlan 70
 name MGMT
vlan 80
 name VOICE
vlan 90
 name GUEST
vlan 999
 name NATIVE

! Module 3: LACP EtherChannel Trunking
interface Port-channel1
 description Trunk Link to ACC-F1-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 switchport nonegotiate

interface Port-channel2
 description Trunk Link to ACC-F2-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 switchport nonegotiate

interface Port-channel3
 description Trunk Link to ACC-F3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 switchport nonegotiate

interface GigabitEthernet0/1
 description Uplink to ACC-F1-01 Gi0/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 channel-group 1 mode active

interface GigabitEthernet0/2
 description Uplink to ACC-F1-01 Gi0/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 channel-group 1 mode active

! Module 4: Layer 3 Inter-VLAN SVI Routing & Core Gateways
ip routing

interface Vlan10
 description Gateway for Software Development
 ip address 10.10.10.1 255.255.255.0
 ip access-group ACL_DEV_IN in
 no shutdown

interface Vlan20
 description Gateway for Quality Assurance Lab
 ip address 10.10.20.1 255.255.255.0
 no shutdown

interface Vlan30
 description Gateway for Human Resources
 ip address 10.10.30.1 255.255.255.128
 ip access-group ACL_HR_IN in
 no shutdown

interface Vlan40
 description Gateway for Finance & Payroll
 ip address 10.10.40.1 255.255.255.128
 ip access-group ACL_FIN_IN in
 no shutdown

interface Vlan50
 description Gateway for Executive Leadership
 ip address 10.10.50.1 255.255.255.128
 no shutdown

interface Vlan60
 description Gateway for Core Application Servers
 ip address 10.10.60.1 255.255.255.0
 no shutdown

interface Vlan70
 description Out-of-Band Switch Management Interface
 ip address 10.10.70.10 255.255.255.0
 no shutdown

interface Vlan80
 description Gateway for VoIP Telephony & Security CCTV
 ip address 10.10.80.1 255.255.255.0
 no shutdown

interface Vlan90
 description Gateway for Guest Visitor Wi-Fi
 ip address 10.10.90.1 255.255.255.0
 ip access-group ACL_GUEST_IN in
 no shutdown

! Module 5: Egress Routing Towards Firewall
ip route 0.0.0.0 0.0.0.0 10.10.70.2

! Module 6: Inter-VLAN Extended Access Control Lists (ACLs)
ip access-list extended ACL_DEV_IN
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.60.21 eq 22
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.60.21 eq 443
 permit udp 10.10.10.0 0.0.0.255 host 10.10.60.23 eq 53
 deny ip 10.10.10.0 0.0.0.255 10.10.40.0 0.0.0.127
 deny ip 10.10.10.0 0.0.0.255 10.10.30.0 0.0.0.127
 deny ip 10.10.10.0 0.0.0.255 10.10.70.0 0.0.0.255
 permit ip 10.10.10.0 0.0.0.255 any

ip access-list extended ACL_FIN_IN
 permit tcp 10.10.40.0 0.0.0.127 host 10.10.60.22 eq 1433
 permit tcp 10.10.40.0 0.0.0.127 host 10.10.60.22 eq 443
 permit udp 10.10.40.0 0.0.0.127 host 10.10.60.23 eq 53
 deny ip 10.10.40.0 0.0.0.127 10.10.10.0 0.0.0.255
 deny ip 10.10.40.0 0.0.0.127 10.10.20.0 0.0.0.255
 deny ip 10.10.40.0 0.0.0.127 10.10.70.0 0.0.0.255
 permit ip 10.10.40.0 0.0.0.127 any

ip access-list extended ACL_HR_IN
 permit tcp 10.10.30.0 0.0.0.127 host 10.10.60.22 eq 443
 permit udp 10.10.30.0 0.0.0.127 host 10.10.60.23 eq 53
 deny ip 10.10.30.0 0.0.0.127 10.10.40.0 0.0.0.127
 deny ip 10.10.30.0 0.0.0.127 10.10.10.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.127 any

ip access-list extended ACL_GUEST_IN
 deny ip 10.10.90.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.10.90.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.10.90.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.10.90.0 0.0.0.255 any

! Module 7: Management Lines Security
line con 0
 logging synchronous
line vty 0 15
 transport input ssh
 login local
end
