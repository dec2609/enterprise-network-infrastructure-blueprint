! ACC-F3-01 Production Configuration
hostname ACC-F3-01
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
ip dhcp snooping
ip dhcp snooping vlan 10-90

vlan 50
 name EXEC
vlan 60
 name SERVER
vlan 70
 name MGMT
vlan 999
 name NATIVE

interface Port-channel1
 description LACP Uplink to CORE-L3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 switchport mode trunk
 ip dhcp snooping trust

interface GigabitEthernet0/1
 switchport mode trunk
 channel-group 1 mode active

interface GigabitEthernet0/2
 switchport mode trunk
 channel-group 1 mode active

interface range FastEthernet0/1 - 8
 description Executive Workstations
 switchport mode access
 switchport access vlan 50
 switchport port-security
 spanning-tree portfast

interface range FastEthernet0/9 - 16
 description IT Admin Workstations
 switchport mode access
 switchport access vlan 70
 switchport port-security
 spanning-tree portfast

interface range FastEthernet0/17 - 24
 description MDF Server Connections
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast

interface Vlan70
 ip address 10.10.70.23 255.255.255.0
 no shutdown

ip default-gateway 10.10.70.1
end
