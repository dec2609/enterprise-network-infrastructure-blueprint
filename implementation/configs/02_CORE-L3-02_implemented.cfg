! ==============================================================================
! DEVICE: CORE-L3-02 (Standby Core Switch / L2 Secondary Bridge - Catalyst 3650)
! ROLE: Secondary L2 STP Bridge & Backup Trunk Aggregator
! STATUS: RECONCILED & FROZEN (PHASE 12)
! ==============================================================================
version 16.3
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-L3-02
!
spanning-tree mode rapid-pvst
spanning-tree logging
spanning-tree extend system-id
spanning-tree vlan 1-999 priority 8192
!
vlan 10
 name DEV_Zone
vlan 20
 name QA_Zone
vlan 30
 name HR_Zone
vlan 40
 name FIN_Zone
vlan 50
 name EXEC_Zone
vlan 60
 name SERVER_Zone
vlan 70
 name MGMT_TRANSIT_Zone
vlan 80
 name QUARANTINE_Zone
vlan 90
 name GUEST_Zone
vlan 999
 name NATIVE_DEAD_Zone
!
no ip routing
!
interface GigabitEthernet1/0/23
 description Inter-Core Standby Trunk Link 1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface GigabitEthernet1/0/24
 description Inter-Core Standby Trunk Link 2 (RSTP Altn BLK)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface Vlan70
 description Management Interface for Core 2
 ip address 10.10.70.11 255.255.255.0
!
ip default-gateway 10.10.70.10
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
