! ==============================================================================
! DEVICE: CORE-L3-01 (Active Core Switch - Catalyst 3650)
! ROLE: L3 Centralized SVI Routing Gateway & Primary STP Root
! STATUS: RECONCILED & FROZEN (PHASE 12)
! ==============================================================================
version 16.3
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-L3-01
!
boot-start-marker
boot-end-marker
!
spanning-tree mode rapid-pvst
spanning-tree logging
spanning-tree extend system-id
spanning-tree vlan 1-999 priority 4096
!
vlan internal allocation policy ascending
!
vlan 10
 name DEV_Zone
vlan 20
 name QA_Zone
vlan 30
 name HR_Zone
vlan 40
 name FIN_Zone
vlan 50
 name EXEC_Zone
vlan 60
 name SERVER_Zone
vlan 70
 name MGMT_TRANSIT_Zone
vlan 80
 name QUARANTINE_Zone
vlan 90
 name GUEST_Zone
vlan 999
 name NATIVE_DEAD_Zone
!
ip routing
!
ip access-list extended ACL_DEV_IN
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.60.21 eq 22
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.60.21 eq 443
 permit udp 10.10.10.0 0.0.0.255 host 10.10.60.10 eq domain
 permit ip 10.10.10.0 0.0.0.255 host 10.10.70.2
 deny ip any 10.0.0.0 0.255.255.255
 permit ip any any
!
ip access-list extended ACL_FIN_IN
 permit tcp 10.10.40.0 0.0.0.255 host 10.10.60.21 eq 443
 permit udp 10.10.40.0 0.0.0.255 host 10.10.60.10 eq domain
 permit ip 10.10.40.0 0.0.0.255 host 10.10.70.2
 deny ip any 10.0.0.0 0.255.255.255
 permit ip any any
!
ip access-list extended ACL_GUEST_IN
 permit udp 10.10.90.0 0.0.0.255 host 10.10.60.10 eq domain
 permit ip 10.10.90.0 0.0.0.255 host 10.10.70.2
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip any any
!
interface Port-channel1
 description Trunk EtherChannel to ACC-F1-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface Port-channel2
 description Trunk EtherChannel to ACC-F2-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface Port-channel3
 description Trunk EtherChannel to ACC-F3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface GigabitEthernet1/0/1
 description Member 1 of Po1 to ACC-F1-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet1/0/2
 description Member 2 of Po1 to ACC-F1-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet1/0/3
 description Member 1 of Po2 to ACC-F2-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 2 mode active
!
interface GigabitEthernet1/0/4
 description Member 2 of Po2 to ACC-F2-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 2 mode active
!
interface GigabitEthernet1/0/5
 description Member 1 of Po3 to ACC-F3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 3 mode active
!
interface GigabitEthernet1/0/6
 description Member 2 of Po3 to ACC-F3-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 3 mode active
!
interface GigabitEthernet1/0/23
 description Inter-Core Primary Trunk Link 1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface GigabitEthernet1/0/24
 description Inter-Core Primary Trunk Link 2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
!
interface Vlan10
 description Gateway for DEV Zone
 mac-address 000c.cfdb.7601
 ip address 10.10.10.1 255.255.255.0
 ip access-group ACL_DEV_IN in
!
interface Vlan20
 description Gateway for QA Zone
 ip address 10.10.20.1 255.255.255.0
!
interface Vlan30
 description Gateway for HR Zone
 ip address 10.10.30.1 255.255.255.0
!
interface Vlan40
 description Gateway for FIN Zone
 ip address 10.10.40.1 255.255.255.0
 ip access-group ACL_FIN_IN in
!
interface Vlan50
 description Gateway for EXEC Zone
 ip address 10.10.50.1 255.255.255.0
!
interface Vlan60
 description Gateway for SERVER Zone
 ip address 10.10.60.1 255.255.255.0
!
interface Vlan70
 description Transit Link to Firewall Egress
 ip address 10.10.70.10 255.255.255.0
!
interface Vlan80
 description Gateway for QUARANTINE Zone
 ip address 10.10.80.1 255.255.255.0
!
interface Vlan90
 description Gateway for GUEST Zone
 ip address 10.10.90.1 255.255.255.0
 ip access-group ACL_GUEST_IN in
!
ip route 0.0.0.0 0.0.0.0 10.10.70.2
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
