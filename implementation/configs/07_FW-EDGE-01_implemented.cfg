: ==============================================================================
: DEVICE: FW-EDGE-01 (Next-Gen Edge Firewall - ASA 5506-X)
: ROLE: Perimeter Defense, Inside/Outside Transit Security & Statefull NAT
: STATUS: RECONCILED & FROZEN (PHASE 12)
: ==============================================================================
ASA Version 9.6(1)
!
hostname FW-EDGE-01
!
interface GigabitEthernet1/1
 nameif inside
 security-level 100
 ip address 10.10.70.2 255.255.255.0
!
interface GigabitEthernet1/2
 nameif outside
 security-level 0
 ip address 172.16.1.1 255.255.255.252
!
object network OBJ_INSIDE_SUBNET
 subnet 10.10.0.0 255.255.0.0
 nat (inside,outside) dynamic interface
!
access-list OUTSIDE_IN extended permit tcp any host 10.10.60.21 eq 443
access-list OUTSIDE_IN extended deny ip any any
!
access-group OUTSIDE_IN in interface outside
!
route outside 0.0.0.0 0.0.0.0 172.16.1.2 1
route inside 10.10.0.0 255.255.0.0 10.10.70.10 1
!
telnet timeout 15
ssh timeout 15
!
end
