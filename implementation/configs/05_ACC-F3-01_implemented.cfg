! ==============================================================================
! DEVICE: ACC-F3-01 (Access Switch Floor 3 - Catalyst 2960)
! ROLE: Floor 3 Access Ports (EXEC, SERVER Zone, CCTV, Management)
! STATUS: RECONCILED & FROZEN (PHASE 12)
! ==============================================================================
version 15.0
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ACC-F3-01
!
spanning-tree mode rapid-pvst
spanning-tree logging
spanning-tree extend system-id
!
vlan 50
 name EXEC_Zone
vlan 60
 name SERVER_Zone
vlan 70
 name MGMT_TRANSIT_Zone
vlan 80
 name QUARANTINE_Zone
vlan 90
 name GUEST_Zone
vlan 999
 name NATIVE_DEAD_Zone
!
ip dhcp snooping
ip dhcp snooping vlan 50,60,70,80,90
no ip dhcp snooping information option
!
interface Port-channel3
 description LACP Trunk Uplink to CORE-L3-01
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 ip dhcp snooping trust
!
interface FastEthernet0/1
 description Executive PC 1
 switchport access vlan 50
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/10
 description Infrastructure DNS/DHCP Server (`10.10.60.10`)
 switchport access vlan 60
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet0/11
 description Git / CI-CD Server (`10.10.60.21`)
 switchport access vlan 60
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet0/23
 description LACP Member 1 to Core 1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 3 mode active
!
interface FastEthernet0/24
 description LACP Member 2 to Core 1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-90,999
 switchport mode trunk
 channel-group 3 mode active
!
interface Vlan70
 description Management SVI
 ip address 10.10.70.103 255.255.255.0
!
ip default-gateway 10.10.70.10
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
