! ==============================================================================
! DEVICE: RTR-EDGE-01 (Border / Edge Router - ISR 4331)
! ROLE: WAN Gateway, Internet Egress & NAT Overload
! STATUS: RECONCILED & FROZEN (PHASE 12)
! ==============================================================================
version 16.6
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname RTR-EDGE-01
!
interface GigabitEthernet0/0/0
 description Inside Interface from ASA Firewall Transit
 ip address 172.16.1.2 255.255.255.252
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/0/1
 description ISP Public WAN Interface
 ip address 203.0.113.2 255.255.255.248
 ip nat outside
 duplex auto
 speed auto
!
ip access-list extended ACL_NAT_PAT
 permit ip 10.10.0.0 0.0.255.255
!
ip nat inside source list ACL_NAT_PAT interface GigabitEthernet0/0/1 overload
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 10.10.0.0 255.255.0.0 172.16.1.1
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
